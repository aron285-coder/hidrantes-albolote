# TR-101: dependencias al día sin intervención en lo que no llega a producción. Solo los parches de
# desarrollo de .github/automerge-permitidos.txt se fusionan solos (automerge.yml); los menores, los
# mayores y todo lo que va en el bundle o corre con los secretos de producción esperan a una revisión
# (docs/31 RV-132, DEC-172; docs/32 RV-204, DEC-181).
#
# cooldown: una versión recién publicada no se propone hasta pasados 7 días. Si un paquete o una
# action se publica comprometida, suele detectarse y retirarse antes (docs/31 RV-132).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    # El primer grupo que encaja se queda la dependencia: los parches de desarrollo de la lista de
    # permitidos van en su PR, que es el único que automerge.yml fusiona solo. Los nombres son los
    # de .github/automerge-permitidos.txt, exactos y en el mismo orden (scripts/seguridad-ci.test.ts,
    # docs/35 RV-410).
    groups:
      parches-desarrollo:
        dependency-type: development
        update-types: [patch]
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-plugin-react-hooks'
          - 'eslint-plugin-react-refresh'
          - 'prettier'
          - '@types/geojson'
          - '@types/leaflet'
          - '@types/node'
          - '@types/react'
          - '@types/react-dom'
          - 'globals'
          - '@axe-core/playwright'
      resto:
        update-types: [minor, patch]

  # docs/35 RV-410 (DEC-198): el wrangler con el que se despliega, aparte y en versión exacta. Corre
  # con los secretos de Cloudflare: nunca se fusiona solo (wrangler no está en la lista de permitidos)
  # y cada PR se revisa con pr-review-toolkit, mirando el changelog.
  - package-ecosystem: npm
    directory: /.github/despliegue
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)

  # Las actions van fijadas por SHA con la etiqueta en un comentario; Dependabot actualiza los dos.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
