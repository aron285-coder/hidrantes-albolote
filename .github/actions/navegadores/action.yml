name: Navegadores de Playwright
description: Chromium y Firefox (TR-21, RV-28) con caché por versión de @playwright/test (DEC-100); cada instalación con tope y un reintento (docs/32 RV-207); las bibliotecas del sistema, con caché por imagen del runner.
inputs:
  navegadores:
    description: Los navegadores que se instalan, separados por espacios.
    default: chromium firefox
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        NAVEGADORES: ${{ inputs.navegadores }}
      run: |
        echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
        echo "navegadores=$(echo $NAVEGADORES | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        # ImageOS e ImageVersion los pone el runner: otra imagen trae otros paquetes.
        echo "imagen=${ImageOS:-sin-imagen}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"
    # Los navegadores en la clave: una caché solo con chromium no sirve a quien necesita firefox.
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.navegadores }}
    # Los .deb de las bibliotecas del sistema: sin ellos, cada trabajo baja ~100 paquetes del espejo de
    # Ubuntu, que el 9 oct 2026 se pasó del tope varias veces y paró dos releases.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/debs-playwright
        key: debs-playwright-${{ steps.version.outputs.imagen }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.navegadores }}
    # Sin acierto, primero los navegadores (de la CDN de Playwright, no del espejo de Ubuntu).
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NAVEGADORES: ${{ inputs.navegadores }}
      run: |
        source .github/scripts/instalar-navegadores.sh
        # Sin comillas: un argumento por navegador.
        con_reintento 200 npx playwright install $NAVEGADORES
    - shell: bash
      env:
        NAVEGADORES: ${{ inputs.navegadores }}
      run: |
        source .github/scripts/instalar-navegadores.sh
        instalar_bibliotecas ~/debs-playwright $NAVEGADORES
