# Staging: cada merge a develop (04 §4, §11). Migraciones con psql, nunca `supabase db push`.
name: Desplegar staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://hidrantes-albolote-staging.pages.dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          psql: 'true'

      - name: Migraciones (hidrantes_migrador, DEC-052)
        run: npm run migrar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Propietario como administrador (sin correo en el repositorio, DEC-053)
        run: npm run asegurar-propietario
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROPIETARIO_EMAIL: ${{ secrets.PROPIETARIO_EMAIL }}

      - name: Zona de cobertura
        run: npm run cargar-zona
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Seed de staging, idempotente
        run: psql -X -q -v ON_ERROR_STOP=1 -f supabase/seed-staging.sql "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - run: npm run build
        env:
          VITE_ENTORNO: ${{ vars.VITE_ENTORNO }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPABASE_URL: ${{ vars.VITE_MAPABASE_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Desplegar a Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "${{ vars.PAGES_PROYECTO }}" --branch develop --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comprobar versión, banda y cabeceras servidas (TR-100)
        run: npm run comprobar-despliegue -- --url https://hidrantes-albolote-staging.pages.dev --entorno staging

      # TR-100: las mismas cabeceras, leídas con un navegador sobre lo desplegado, y que la página
      # carga sin violar su propia CSP. Solo GET a la portada: no se envía ni se lee ningún dato.
      - name: Cabeceras y CSP en el navegador (TR-100)
        env:
          URL_DESPLEGADA: https://hidrantes-albolote-staging.pages.dev
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/cabeceras.spec.ts --project=escritorio

      # TR-103: rendimiento ≥ 85, accesibilidad ≥ 95, buenas prácticas ≥ 95 y manifiesto instalable,
      # sobre lo desplegado y con el móvil emulado que trae Lighthouse por defecto. Los umbrales
      # están en .github/lighthouse.json. La acción no necesita ninguna dependencia del proyecto.
      - name: Lighthouse sobre staging (TR-103)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://hidrantes-albolote-staging.pages.dev/
          configPath: .github/lighthouse.json
          uploadArtifacts: true
          temporaryPublicStorage: false
