# Staging: cada merge a develop (04 §4, §11). Migraciones con psql, nunca `supabase db push`.
#
# docs/35 RV-410 (DEC-198): el código de las dependencias no corre con secretos. Cuatro trabajos:
#   construir  sin environment ni secretos: npm ci y el build; sube dist.
#   fotos-seed sin secretos: genera en Chromium las fotos del seed; las sube como artefacto.
#   desplegar  con el environment staging y sin node_modules: los scripts con `node`, y wrangler
#              desde .github/despliegue (solo wrangler, con su lockfile y sin scripts de instalación).
#   comprobar  sin secretos: lo desplegado, con el e2e de cabeceras y Lighthouse. comprobar-despliegue
#              (solo Node) va en desplegar, antes de anunciar la versión del mapa base (RV-21).
name: Desplegar staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar
      # Variables públicas (van dentro del bundle): las del repositorio, porque este trabajo no tiene
      # environment. «desplegar» comprueba que dist lleva las del environment staging.
      - run: npm run build
        env:
          VITE_ENTORNO: staging
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY_STAGING }}
          VITE_MAPABASE_URL: ${{ vars.VITE_MAPABASE_URL_STAGING }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY_STAGING }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # docs/33 RV-340: las fotos `fotos/prueba-*.jpg` del seed, generadas en Chromium con «[PRUEBA]» y sin
  # datos personales. Aquí solo se generan; «desplegar» sube las que falten, sin Chromium.
  fotos-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar
      - uses: ./.github/actions/navegadores
        timeout-minutes: 9
        with:
          navegadores: chromium
      - name: Generar las fotos del seed
        run: npm run fotos-seed -- --generar fotos-seed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fotos-seed
          path: fotos-seed
          retention-days: 1
          if-no-files-found: error

  # Con construir en verde, aunque fotos-seed falle: staging se despliega igual, y el paso de las fotos
  # falla al final (como antes, cuando iban después de desplegar).
  desplegar:
    needs: [construir, fotos-seed]
    if: ${{ !cancelled() && needs.construir.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://hidrantes-albolote-staging.pages.dev
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia completa: VERSION_CODIGO del Worker es el último commit que tocó workers/ (docs/20
          # RV-74), y con una historia corta saldría otro.
          fetch-depth: 0
          persist-credentials: false
      # Node 24 sin caché de npm y sin npm ci: los scripts corren con `node`, que les quita los tipos.
      - uses: ./.github/actions/preparar
        with:
          npm: 'false'
          psql: 'true'
      # Solo wrangler, en versión exacta y con su lockfile, sin scripts de instalación (DEC-198).
      - name: Wrangler
        run: npm ci --prefix .github/despliegue --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # El build se hizo con las variables del repositorio (construir no tiene environment): dist tiene
      # que llevar las de este environment, o staging serviría una app que habla con otro proyecto.
      # Antes de migrar nada.
      - name: El build es de staging
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_MAPABASE_URL: ${{ vars.VITE_MAPABASE_URL }}
        run: |
          set -euo pipefail
          source .github/scripts/build-del-entorno.sh
          build_del_entorno dist VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_VAPID_PUBLIC_KEY ?VITE_MAPABASE_URL

      - name: Migraciones (hidrantes_migrador, DEC-052)
        run: node scripts/migrar.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Propietario como administrador (sin correo en el repositorio, DEC-053)
        run: node scripts/asegurar-propietario.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROPIETARIO_EMAIL: ${{ secrets.PROPIETARIO_EMAIL }}

      - name: Zona de cobertura
        run: node scripts/cargar-zona.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # El código de acceso de staging no está en el repositorio (docs/35 RV-411, DEC-200): llega del
      # secreto CODIGO_STAGING como variable de psql y no se escribe en la salida. codigo-staging.sql
      # cambia el de pruebas, o uno anterior del despliegue, y revoca los móviles; el de jefatura no.
      - name: Seed de staging, idempotente, y su código de acceso
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CODIGO_STAGING: ${{ secrets.CODIGO_STAGING }}
        run: |
          set -euo pipefail
          if ! [[ "${CODIGO_STAGING:-}" =~ ^[0-9]{6}$ ]]; then
            echo '::error::Falta CODIGO_STAGING (seis cifras) en el environment staging: npm run arranque -- --codigo-staging (15 §2)'
            exit 1
          fi
          psql -X -q -v ON_ERROR_STOP=1 -v codigo="$CODIGO_STAGING" -f supabase/seed-staging.sql "$SUPABASE_DB_URL"
          psql -X -q -v ON_ERROR_STOP=1 -v codigo="$CODIGO_STAGING" -f scripts/sql/codigo-staging.sql "$SUPABASE_DB_URL"

      # ENTORNO para las Functions (docs/31 RV-130; la usa RV-146). Antes de desplegar: Pages solo
      # aplica sus variables a los despliegues nuevos.
      - name: Variable ENTORNO en Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          source .github/scripts/entorno-pages.sh
          poner_entorno hidrantes-albolote-staging staging

      - name: Desplegar a Cloudflare Pages
        # Nombre fijo (docs/31 RV-130): el token de Cloudflare es de toda la cuenta y también podría
        # desplegar producción; este trabajo nunca la nombra, y scripts/seguridad-ci.test.ts lo comprueba.
        run: .github/despliegue/node_modules/.bin/wrangler pages deploy dist --project-name hidrantes-albolote-staging --branch develop --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # El Worker de los avisos (docs/19 RV-52, DEC-097): uno para los dos entornos, desde develop,
      # porque su código es el mismo y no toca datos. En **cada** push (docs/20 RV-74): si el push que
      # cambió workers/ fallaba antes de este paso, el siguiente ya no lo desplegaba. Tarda segundos.
      # VERSION_CODIGO es el último commit que tocó workers/; la vigilancia lo compara con develop.
      - name: Desplegar el Worker de los avisos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Los nombres de los secretos solo los lista un token con Workers Scripts: Edit, que es lo que
          # hace falta para desplegar; con solo lectura, 403. 200: existe; 404: aún no.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/hidrantes-avisos/secrets" || echo 000)
          if [ "$codigo" = "401" ] || [ "$codigo" = "403" ]; then
            # Un token solo de Pages: staging se ha desplegado igual. No es un fallo silencioso: aviso
            # aquí, en el resumen, y en comprobar-produccion («Workers Scripts: Edit»).
            aviso="El token de Cloudflare no tiene permiso de Workers (HTTP $codigo): el Worker de los avisos no se despliega desde aquí. Añade «Account · Workers Scripts: Edit» al token (15 §2, DEC-097); mientras, npm run arranque -- --solo-faltantes lo despliega con la sesión de wrangler."
            echo "::warning::$aviso"
            echo "$aviso" >> "$GITHUB_STEP_SUMMARY"
          else
            version=$(git log -1 --format=%H -- workers)
            .github/despliegue/node_modules/.bin/wrangler deploy --config workers/avisos/wrangler.toml --var "VERSION_CODIGO:$version"
          fi

      # Espera a que Pages sirva la versión nueva y mira cabeceras y mapa base. Solo Node: aquí, antes
      # de anunciar la versión del mapa base (RV-21).
      - name: Comprobar versión, banda y cabeceras servidas (TR-100)
        run: node scripts/comprobar-despliegue.ts --url https://hidrantes-albolote-staging.pages.dev --entorno staging
        env:
          # Para ver con dos peticiones iguales que la caché de las Functions funciona (docs/19 RV-63).
          # El de staging, en su environment (docs/35 RV-411, DEC-200).
          VIGILANCIA_SECRETO: ${{ secrets.VIGILANCIA_SECRETO }}

      # Después de desplegar y comprobar: la versión del mapa base se anuncia cuando ya se sirve (RV-21).
      - name: Versión del mapa base en Salud del sistema (FR-143)
        run: node scripts/cargar-version-mapabase.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # docs/33 RV-340: las fotos del seed existen en el bucket de staging. Sube las que falten (las
      # generó el trabajo fotos-seed) y comprueba que cada una responde 200 en su URL pública; si
      # alguna no, falla. Después del seed. Solo staging: el script se niega con otra SUPABASE_URL.
      # Si fotos-seed falló, no hay artefacto y esto falla aquí, con staging ya desplegado.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fotos-seed
          path: fotos-seed
      - name: Fotos del seed de staging (docs/33 RV-340)
        run: node scripts/fotos-seed-staging.ts --desde fotos-seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # Sin secretos: lo desplegado, con un navegador y con Lighthouse.
  comprobar:
    needs: [desplegar]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar

      # TR-100: las mismas cabeceras, leídas con un navegador sobre lo desplegado, y que la página
      # carga sin violar su propia CSP. Solo GET a la portada: no se envía ni se lee ningún dato.
      # Chromium con caché, tope y un reintento (docs/32 RV-207).
      - uses: ./.github/actions/navegadores
        timeout-minutes: 9
        with:
          navegadores: chromium
      - name: Cabeceras y CSP en el navegador (TR-100)
        env:
          URL_DESPLEGADA: https://hidrantes-albolote-staging.pages.dev
        run: npx playwright test e2e/cabeceras.spec.ts --project=escritorio

      # TR-103: rendimiento ≥ 85, accesibilidad ≥ 95, buenas prácticas ≥ 95 y manifiesto instalable,
      # sobre lo desplegado y con el móvil emulado que trae Lighthouse por defecto. Los umbrales
      # están en .github/lighthouse.json. La acción no necesita ninguna dependencia del proyecto.
      - name: Lighthouse sobre staging (TR-103)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: https://hidrantes-albolote-staging.pages.dev/
          configPath: .github/lighthouse.json
          uploadArtifacts: true
          temporaryPublicStorage: false
