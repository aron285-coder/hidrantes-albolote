# Versión semántica, CHANGELOG.md y tag a partir de los commits convencionales (04 §11.1).
# Trabaja sobre develop: la versión sube con cada release PR y llega a main con el PR develop → main,
# así main y develop nunca divergen por el changelog (DEC-053).
name: Versiones

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Un PR abierto con GITHUB_TOKEN no dispara la CI, y la protección de develop exige los tres
      # checks. Se lanza la CI sobre la rama para ver el resultado cuanto antes, pero **eso no basta
      # para fusionar**: los checks de un `workflow_dispatch` no cuentan como checks del PR (se
      # comprobó el 21 sep 2026 con el PR de la 0.1.0). Hace falta un empujón de una persona, porque
      # lo que hace GITHUB_TOKEN nunca dispara otro workflow (DEC-079).
      - if: steps.release.outputs.pr
        run: |
          gh workflow run ci.yml --repo "$REPO" --ref "$RAMA" || true
          {
            echo "### PR de versión abierto"
            echo "La CI lanzada desde aquí es solo informativa. Para poder fusionarlo, un humano tiene"
            echo "que empujar la rama una vez (eso sí dispara los checks del PR):"
            echo '```'
            echo "git fetch origin $RAMA && git switch -c version-nueva FETCH_HEAD"
            echo "git commit --allow-empty -m 'chore(release): lanzar la CI del PR de versión'"
            echo "git push origin HEAD:$RAMA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RAMA: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
