# TR-101: las actualizaciones de parche y menores de Dependabot se fusionan solas con CI verde.
# Las mayores abren PR y esperan a que alguien las mire.
name: Fusión automática de Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  fusionar:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
