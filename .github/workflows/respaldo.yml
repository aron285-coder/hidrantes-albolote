# Respaldo cifrado (04 §9, TR-50, TR-51; procedimiento de restauración en 15 §5.3).
#
#   - Datos: pg_dump del esquema hidrantes, semanal, cifrado con GPG y guardado como artefacto 90
#     días. Nunca se escribe en una rama: el volcado lleva nombres de voluntarios y el historial de
#     Git no se puede purgar (04 §9, 11 §2).
#   - Fotos: el bucket entero, el primer domingo de cada mes, con el mismo cifrado.
#
# En el environment `prod-tareas` y no en `production`: production exige aprobación humana en cada
# ejecución (es lo que protege los despliegues), y un respaldo que espera a que alguien pulse un botón
# no es un respaldo (DEC-071). prod-tareas no tiene revisores, pero solo admite la rama develop: los
# secretos de producción ya no están al alcance de un workflow de cualquier rama (docs/31 RV-131,
# DEC-172).
name: Respaldo

on:
  schedule:
    # Domingos de madrugada, cuando nadie está enviando nada.
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      fotos:
        description: Incluir las fotos (si no, solo los datos)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-24.04
    environment: prod-tareas
    timeout-minutes: 45
    # Donde se comprueba de verdad el respaldo (docs/31 RV-134): el volcado de esta semana se restaura
    # aquí con restaurar.ts y se cuentan los puntos. La misma imagen que `supabase start` (roles de
    # Supabase, PostGIS, pg_cron), en el puerto del Supabase local. Efímero: muere con el trabajo.
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.6.1.171
        env:
          POSTGRES_PASSWORD: postgres # detectar-secretos:permitir (Postgres de servicio efímero)
        ports:
          - 55422:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar
        with:
          psql: 'true'

      - name: Comprobar que están los secretos
        env:
          BD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          SERVICIO: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
          CLAVE_GPG: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_HUELLA: ${{ vars.GPG_HUELLA }}
        run: |
          set -euo pipefail
          falta=0
          for v in BD SERVICIO CLAVE_GPG GPG_HUELLA; do
            if [ -z "${!v}" ]; then echo "::error::Falta $v (los secretos de producción, en el environment prod-tareas; GPG_HUELLA es una variable del repositorio, docs/32 RV-202)"; falta=1; fi
          done
          if [ "$falta" = 1 ]; then
            {
              echo "### Respaldo no configurado"
              echo
              echo 'Los secretos de producción van en el environment `prod-tareas`, **nunca en el'
              echo 'repositorio**: ahí los leería un workflow de cualquier rama (DEC-172). Se mueven sin'
              echo 'ver el valor con el traspaso, desde donde estén ahora:'
              echo '```'
              echo 'npm run traspasar-secreto -- --secreto SUPABASE_DB_URL_PROD,SUPABASE_SERVICE_ROLE_KEY_PROD --desde <sitio> --hacia prod-tareas'
              echo '```'
              echo 'Si no están en ningún sitio: `npm run arranque -- --rotar db` rehace la cadena, o se pone'
              echo 'cada uno por la entrada estándar con `gh secret set <NOMBRE> --env prod-tareas`.'
              echo
              echo '`GPG_PUBLIC_KEY` es la clave pública (no es secreta) y es la única que va en el'
              echo 'repositorio. Si falta: `npm run traspasar-secreto -- --secreto GPG_PUBLIC_KEY --desde production --hacia repositorio`.'
              echo '`GPG_HUELLA` es una variable del repositorio: la huella de esa clave que da 15 §2 (docs/32 RV-202).'
              echo
              echo 'Por qué `prod-tareas` y no `production`: production exige aprobación humana y un'
              echo 'respaldo semanal no puede esperar a que alguien pulse un botón (DEC-071).'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # La conexión directa (db.«ref».supabase.co) solo resuelve por IPv6 y los runners de
          # GitHub no tienen IPv6: pg_dump diría "Network is unreachable" ya con el volcado a medias.
          # Tiene que ser el pooler de Supavisor en modo sesión, y como hidrantes_migrador (DEC-052).
          if printf '%s' "$BD" | grep -q '@db\..*\.supabase\.co'; then
            echo "::error::SUPABASE_DB_URL_PROD apunta a la conexión directa; hace falta el pooler (04 §10)"
            {
              echo "### La cadena de conexión no sirve para un runner"
              echo
              echo 'Es la conexión directa (`db.«ref».supabase.co`), que solo resuelve por IPv6, y los'
              echo 'runners de GitHub no tienen IPv6. Hace falta el **pooler en modo sesión**, con el'
              echo 'usuario `hidrantes_migrador` (DEC-052):'
              echo '```'
              echo 'postgresql://hidrantes_migrador.«ref»:«clave»@aws-0-«region».pooler.supabase.com:5432/postgres' # detectar-secretos:permitir (la forma de la cadena, con marcadores en lugar de valores)
              echo '```'
              echo 'Lo deja puesto `npm run arranque -- --rotar db`, que además regenera esa clave.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! printf '%s' "$BD" | grep -q '://hidrantes_migrador\.'; then
            echo "::warning::La cadena no usa hidrantes_migrador: el respaldo no necesita ser postgres (DEC-052)"
          fi

      - name: Fecha del respaldo
        id: cuando
        run: |
          echo "fecha=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Primer domingo del mes: toca también el bucket de fotos (04 §9).
          echo "mensual=$([ "$(date -u +%d)" -le 7 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # La clave es la de docs/15 §2 (docs/32 RV-202): GPG_HUELLA es una variable del repositorio con
      # su huella. Si GPG_PUBLIC_KEY trae otra, el respaldo no se podría descifrar con la clave privada
      # que se guarda: el job falla aquí, antes de cifrar nada, y abre la issue del final.
      - name: Importar la clave pública de cifrado
        env:
          CLAVE_GPG: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_HUELLA: ${{ vars.GPG_HUELLA }}
        run: |
          set -euo pipefail
          source .github/scripts/clave-gpg.sh
          printf '%s' "$CLAVE_GPG" | comprobar_clave "$GPG_HUELLA"
          printf '%s' "$CLAVE_GPG" | gpg --batch --import
          # Es una clave de respaldo, no hay cadena de confianza que validar: se cifra igualmente.
          echo "DESTINATARIO=$GPG_HUELLA" >> "$GITHUB_ENV"

      - name: Volcado del esquema hidrantes, cifrado
        env:
          PGSSLMODE: require
          BD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          FECHA: ${{ steps.cuando.outputs.fecha }}
        run: |
          set -euo pipefail
          # Solo el esquema hidrantes: public es de la app de uniformidad y no se toca (CLAUDE.md §3).
          # Con los permisos dentro (nada de --no-privileges): sin los GRANT, una base restaurada
          # deja a anon sin las nueve RPC de voluntario y la aplicación no arranca. Se vio en el
          # ensayo de restauración de la Fase 8. Sin propietarios, en cambio, porque quien restaura
          # es hidrantes_migrador y los objetos han de quedar suyos.
          #
          # Sin cifrar, primero, en la carpeta temporal del runner (fuera del espacio de trabajo y solo
          # legible por el runner): es lo que se restaura después en el Postgres de servicio (docs/31
          # RV-134). Se cifra ese mismo archivo, nunca sale del runner y se borra al final aunque algo
          # falle. Los puntos se cuentan antes y después del volcado: el restaurado tiene que tener
          # uno de los dos números.
          umask 077
          plano="$RUNNER_TEMP/hidrantes-$FECHA.sql"
          # Ya, antes de escribirlo: si pg_dump o gpg fallan, el paso de borrado tiene que saber dónde está.
          echo "PLANO=$plano" >> "$GITHUB_ENV"
          puntos_antes=$(psql -X -A -t -v ON_ERROR_STOP=1 "$BD" -c 'select count(*) from hidrantes.puntos')
          pg_dump --schema=hidrantes --no-owner --format=plain --file "$plano" "$BD"
          puntos_despues=$(psql -X -A -t -v ON_ERROR_STOP=1 "$BD" -c 'select count(*) from hidrantes.puntos')
          gpg --batch --yes --trust-model always --encrypt --recipient "$DESTINATARIO" \
              --output "hidrantes-$FECHA.sql.gpg" "$plano"
          # Que de verdad va para esa clave y para nada más (RV-202), antes de guardarlo como artifact.
          source .github/scripts/clave-gpg.sh
          comprobar_cifrado "$DESTINATARIO" "hidrantes-$FECHA.sql.gpg"
          {
            echo "PUNTOS_ORIGEN=$puntos_antes $puntos_despues"
            echo "TAMANO_DATOS=$(stat -c %s "hidrantes-$FECHA.sql.gpg")"
          } >> "$GITHUB_ENV"

      - name: Comprobar que el volcado no está vacío
        env:
          FECHA: ${{ steps.cuando.outputs.fecha }}
        run: |
          set -euo pipefail
          # Un respaldo de 20 bytes es un respaldo que no existe: mejor fallar y avisar.
          if [ "$TAMANO_DATOS" -lt 10000 ]; then
            echo "::error::El volcado cifrado ocupa $TAMANO_DATOS bytes: demasiado poco para ser bueno"
            exit 1
          fi
          echo "Datos: hidrantes-$FECHA.sql.gpg ($((TAMANO_DATOS / 1024)) kB)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: respaldo-hidrantes
          path: hidrantes-*.sql.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Fotos del bucket, cifradas (mensual)
        id: fotos
        if: steps.cuando.outputs.mensual == 'true' || inputs.fotos
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
          BUCKET: hidrantes-fotos
          FECHA: ${{ steps.cuando.outputs.fecha }}
        run: |
          set -euo pipefail
          npm run respaldo-fotos -- --destino "fotos-$FECHA" | tee salida.txt
          bytes=$(grep -oP '^bytes=\K[0-9]+' salida.txt)
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          # Sin fotos todavía, respaldo-fotos no crea la carpeta y tar fallaba (4 oct 2026, #439):
          # un tar vacío es un respaldo correcto de un bucket vacío.
          mkdir -p "fotos-$FECHA"
          tar -cf - "fotos-$FECHA" \
            | gpg --batch --yes --trust-model always --encrypt --recipient "$DESTINATARIO" \
                  --output "fotos-$FECHA.tar.gpg"
          source .github/scripts/clave-gpg.sh
          comprobar_cifrado "$DESTINATARIO" "fotos-$FECHA.tar.gpg"
          rm -rf "fotos-$FECHA"
          echo "Fotos: fotos-$FECHA.tar.gpg ($((bytes / 1024 / 1024)) MB en origen)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fotos.outcome == 'success'
        with:
          name: respaldo-fotos
          path: fotos-*.tar.gpg
          retention-days: 90
          if-no-files-found: error

      # Que el respaldo de verdad se pueda restaurar (docs/31 RV-134): antes solo se miraba que el
      # archivo pesara más de 10 kB. Después de guardar los artefactos (también el de fotos), para que
      # un fallo aquí no deje la semana sin copia; antes de anotarlo en Salud del sistema, para que un
      # respaldo que no se puede restaurar no salga como bueno. Si falla, el job falla y abre la issue.
      - name: Restaurar el volcado en el Postgres de servicio y contar los puntos
        id: prueba
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # PUNTOS_ORIGEN son dos números: van como dos argumentos.
          bash .github/scripts/probar-restauracion-servicio.sh "$PLANO" $PUNTOS_ORIGEN
          echo "Restauración de prueba: los mismos puntos que producción." >> "$GITHUB_STEP_SUMMARY"

      - name: Anotar el respaldo en Salud del sistema
        env:
          BD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          BYTES_FOTOS: ${{ steps.fotos.outputs.bytes }}
        run: |
          set -euo pipefail
          # FR-143: jefatura ve en Ajustes cuándo fue el último respaldo y cuánto ocupan las fotos.
          # En una sola línea a propósito: dentro de un bloque de YAML, un heredoc sin sangrar
          # rompería el archivo.
          guardar() { psql -X -q -v ON_ERROR_STOP=1 "$BD" -c "insert into hidrantes.config (clave, valor, actualizado_por) values ('$1', $2, 'respaldo.yml') on conflict (clave) do update set valor = excluded.valor, actualizado_por = excluded.actualizado_por;"; }
          guardar ultimo_respaldo 'to_jsonb(now())'
          if [ -n "${BYTES_FOTOS:-}" ]; then guardar storage_bytes "to_jsonb(${BYTES_FOTOS}::bigint)"; fi

      - name: Borrar el volcado sin cifrar
        if: always()
        run: if [ -n "${PLANO:-}" ]; then shred -u "$PLANO" 2>/dev/null || rm -f "$PLANO"; fi

      - name: Avisar si el respaldo ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Un respaldo que falla en silencio es peor que no tenerlo (15 §4).
          titulo="El respaldo semanal ha fallado"
          existe=$(gh issue list --label vigilancia --state open --search "$titulo" --json number --jq '.[0].number // empty')
          cuerpo="La ejecución ${{ github.run_id }} no terminó. Revisa el registro del workflow y 15 §5.3."
          if [ "${{ steps.prueba.outcome }}" = failure ]; then
            cuerpo="$cuerpo El volcado se guardó, pero **no se ha podido restaurar** en la prueba semanal (docs/31 RV-134): no es fiable hasta que se arregle."
          fi
          if [ -n "$existe" ]; then
            gh issue comment "$existe" --body "$cuerpo"
          else
            gh issue create --title "$titulo" --label vigilancia --body "$cuerpo"
          fi
