# Producción: cada merge a main, tras la aprobación del propietario en el environment (04 §4).
# Este flujo nunca carga datos de prueba: la guarda lo comprueba.
name: Desplegar producción

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://hidrantes-albolote.pages.dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # La paridad compara el árbol con el develop fusionado (docs/19 P-03).
          fetch-depth: 0
      - uses: ./.github/actions/preparar
        with:
          psql: 'true'

      - name: Guarda de seguridad
        run: npm run guarda-produccion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VITE_ENTORNO: ${{ vars.VITE_ENTORNO }}
          PAGES_PROYECTO: ${{ vars.PAGES_PROYECTO }}

      - name: Migraciones (hidrantes_migrador, DEC-052)
        run: npm run migrar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Propietario como administrador (sin correo en el repositorio, DEC-053)
        run: npm run asegurar-propietario
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROPIETARIO_EMAIL: ${{ secrets.PROPIETARIO_EMAIL }}

      - name: Zona de cobertura
        run: npm run cargar-zona
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - run: npm run build
        env:
          VITE_ENTORNO: ${{ vars.VITE_ENTORNO }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPABASE_URL: ${{ vars.VITE_MAPABASE_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Desplegar a Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name hidrantes-albolote --branch main --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comprobar versión y cabeceras servidas (TR-100)
        run: npm run comprobar-despliegue -- --url https://hidrantes-albolote.pages.dev --entorno produccion

      # Después de desplegar y comprobar: la versión del mapa base se anuncia cuando ya se sirve (RV-21).
      - name: Versión del mapa base en Salud del sistema (FR-143)
        run: npm run cargar-version-mapabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Producción es la versión de staging (docs/19 P-03, DEC-096): árbol, frontend servido,
      # migraciones, Functions y versiones de datos. Si algo no coincide, el despliegue falla.
      - name: Paridad con develop
        run: npm run paridad -- --url https://hidrantes-albolote.pages.dev
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
