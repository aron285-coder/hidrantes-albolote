# Supabase Free pausa los proyectos tras ~7 días sin actividad; en pausa, ni esta app ni la de
# uniformidad funcionan (DEC-054). Una lectura diaria de la API basta para mantenerlos activos.
# Sin environment a propósito: production exigiría aprobación en cada ejecución. Solo usa la URL
# y la anon key, que son públicas por diseño (04 §1).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tocar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entorno: [STAGING, PROD]
    steps:
      - name: Consulta que llega a la base de datos
        env:
          URL: ${{ vars[format('SUPABASE_URL_{0}', matrix.entorno)] }}
          CLAVE: ${{ vars[format('SUPABASE_ANON_KEY_{0}', matrix.entorno)] }}
        # anon no puede leer hidrantes.migraciones_aplicadas (existe en ambos entornos desde el arranque): Postgres contesta 42501. Esa respuesta prueba que
        # la petición atravesó la API y llegó a la base de datos, que es lo que cuenta como actividad.
        run: |
          set -eu
          [ -n "$URL" ] || { echo "::error::Falta la variable SUPABASE_URL_${{ matrix.entorno }} (npm run arranque)"; exit 1; }
          cuerpo=$(curl -s --max-time 30 -H "apikey: $CLAVE" -H "Authorization: Bearer $CLAVE" \
            -H "Accept-Profile: hidrantes" "$URL/rest/v1/migraciones_aplicadas?select=archivo&limit=1" || true)
          if echo "$cuerpo" | grep -q '"42501"'; then
            echo "Supabase ${{ matrix.entorno }}: la base de datos respondió"
          else
            echo "::error::Supabase ${{ matrix.entorno }} no respondió desde la base de datos (¿en pausa?): ${cuerpo:0:200}"
            exit 1
          fi

      - name: Avisar con una issue si falla
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Supabase ${{ matrix.entorno }} no responde"
          if ! gh issue list --repo "$REPO" --state open --label vigilancia --search "$titulo in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --repo "$REPO" --label vigilancia --title "$titulo" \
              --body "La comprobación diaria falló: $RUN. Si el proyecto está en pausa, restáuralo desde el panel de Supabase (15)."
          fi
