# TEMPORAL (docs/31 RV-134): ensayo del Postgres de servicio con datos de prueba antes de usarlo en
# respaldo.yml. Se borra antes de abrir el PR.
name: Prueba RV-134

on:
  push:
    branches: [fase-9/ops-rv134-prueba]

permissions:
  contents: read

jobs:
  volcado:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      puntos: ${{ steps.v.outputs.puntos }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar
        with:
          psql: 'true'
      - run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,supavisor
      - run: npm run migrar -- --local
      - env:
          PGPASSWORD: migrador-local # detectar-secretos:permitir (Supabase local efímero)
        run: |
          npm run cargar-zona -- --local
          psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55422 -U hidrantes_migrador -d postgres -f supabase/seed-staging.sql
      - id: v
        env:
          BD: postgresql://hidrantes_migrador:migrador-local@127.0.0.1:55422/postgres # detectar-secretos:permitir (Supabase local efímero)
        run: |
          set -euo pipefail
          pg_dump --schema=hidrantes --no-owner --format=plain --file "$RUNNER_TEMP/volcado.sql" "$BD"
          echo "puntos=$(psql "$BD" -XAt -c 'select count(*) from hidrantes.puntos')" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/volcado.sql" volcado-prueba.txt
      - uses: actions/upload-artifact@v7
        with:
          name: volcado-prueba
          path: volcado-prueba.txt
          retention-days: 1

  restaurar:
    needs: volcado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.6.1.171
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55422:5432
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar
        with:
          psql: 'true'
      - uses: actions/download-artifact@v7
        with:
          name: volcado-prueba
      - run: |
          mv volcado-prueba.txt "$RUNNER_TEMP/volcado.sql"
          bash .github/scripts/probar-restauracion-servicio.sh "$RUNNER_TEMP/volcado.sql" "${{ needs.volcado.outputs.puntos }}"
      - name: Y uno que no cuadra tiene que fallar
        run: |
          if bash .github/scripts/probar-restauracion-servicio.sh "$RUNNER_TEMP/volcado.sql" 999999; then
            echo "::error::no ha fallado con un número de puntos distinto"; exit 1
          fi
      - name: Un error con datos no llega al registro del contenedor
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -X -q -c "select 'MARCA-RV134-NO-DEBE-SALIR'::int" || true # detectar-secretos:permitir (Postgres de servicio efímero)
          psql "postgresql://hidrantes_migrador:migrador-local@127.0.0.1:55422/postgres" -X -q -c "insert into hidrantes.puntos (id) values ('MARCA-RV134-FILA')" || true # detectar-secretos:permitir (Postgres de servicio efímero)
          contenedor=$(docker ps -q | head -1)
          docker logs "$contenedor" > registro.txt 2>&1 || true
          echo "lineas del registro: $(wc -l < registro.txt)"
          if grep -q 'MARCA-RV134\|PRUEBA' registro.txt; then echo "::error::el registro tiene datos"; grep -c 'MARCA-RV134\|PRUEBA' registro.txt; exit 1; fi
          echo "el registro no tiene ni la marca ni el seed"
