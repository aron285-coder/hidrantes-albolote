# Integración continua (04 §11). Todo contra Supabase LOCAL: nunca contra dev ni prod.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # release-please.yml la lanza sobre su rama: los PR creados con GITHUB_TOKEN no disparan la CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: ci-calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run formato:comprobar
      - run: npm test
      - run: npm run build
      - run: npm run presupuesto

  sql:
    name: ci-sql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          psql: 'true'
      - name: Supabase local
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,supavisor
      - run: npm run migrar -- --local
      - name: Segunda pasada sin cambios (idempotencia)
        run: npm run migrar -- --local
      - name: Zona y seed de staging, dos veces (idempotentes)
        env:
          PGPASSWORD: migrador-local # detectar-secretos:permitir (contraseña del Supabase local efímero)
        run: |
          npm run cargar-zona -- --local
          for i in 1 2; do
            psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55422 -U hidrantes_migrador -d postgres \
              -f supabase/seed-staging.sql
          done
      - run: npm run test:sql
      - name: Pages Functions con wrangler pages dev contra Supabase local
        run: |
          npm run arranque -- --local
          npm run build
          npm run functions:dev > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8788 && break; sleep 2; done
          npm run probar-functions || { tail -50 wrangler.log; exit 1; }
      - if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: ci-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
